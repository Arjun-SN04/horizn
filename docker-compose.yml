# Run the whole app locally in Docker:  docker compose up --build
# Frontend: http://localhost:8080   Backend: http://localhost:3000
services:
  backend:
    build: ./backend
    env_file: ./backend/.env        # MONGODB_ATLAS_URL, SECRET, CLOUDINARY_* ...
    environment:
      NODE_ENV: development          # plain-HTTP cookies locally (production needs HTTPS)
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPILLARY_ACCESS_TOKEN: ${VITE_MAPILLARY_ACCESS_TOKEN:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
